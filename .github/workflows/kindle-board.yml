name: Kindle sector board

on:
  schedule:
    - cron: "7-59/15 13-22 * * 1-5"   # every 15 min, Mon-Fri, covers 9am-5pm ET all year
  workflow_dispatch:                # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # a long run finishes instead of being cancelled by the next one

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      TZ: America/New_York                       # scanner's "today" = New York date
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}    # "Your Name you@example.com" for SEC EDGAR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/kindle-board.yml
      - run: pip install yfinance pandas matplotlib streamlit plotly requests
      - name: Restore SEC filings + holdings from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            sec_cache
            holdings_cache.json
          key: scanner-data-${{ github.run_id }}
          restore-keys: scanner-data-
      - name: Build pages
        id: build
        run: python kindle_page.py
      - name: Save SEC filings + holdings (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            sec_cache
            holdings_cache.json
          key: scanner-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish != 'false'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.build.outputs.publish != 'false'
